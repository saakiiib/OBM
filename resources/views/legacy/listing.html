<div class="topbar"><div class="container topbar-inner"><span>🇧🇩 Verified-style organisation profile</span><div class="top-links"><a href="directory.html">Directory</a><a href="index.html">Home</a></div></div></div>
<header class="main-header"><div class="container nav-wrap"><a aria-label="Online Bangla Media home" class="brand" href="index.html"><img alt="Online Bangla Media logo" class="brand-logo" height="52" src="assets/logo-header.webp" width="52"/><span><strong>Online Bangla Media</strong><small>News, Directory &amp; Resources for Bangladeshis Worldwide</small></span></a><a href="bangla.html" lang="bn">বাংলা</a></div></header>
<main id="listingRoot"></main>
<footer><div class="footer-bottom"><div class="container"><span>© 2026 Online Bangla Media</span><span><a href="submit.html">Report incorrect information</a></span></div></div></footer>
<script>
const p=new URLSearchParams(location.search), id=p.get('id');
const x=portalListings.find(i=>i.id===id);
if(!x){document.querySelector("#listingRoot").textContent="Listing not found. Return to the directory."; throw new Error("Unknown listing");} document.title=x.name+' — Online Bangla Media';
const mapQuery=(x.lat&&x.lng)?`${x.lat},${x.lng}`:x.address;
const map=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQuery||x.name)}`;
const action=(ok,href,label,cls='')=>ok?`<a class="action ${cls}" target="${href.startsWith('http')?'_blank':'_self'}" rel="${href.startsWith('http')?'noopener':''}" href="${href}">${label}</a>`:'';
document.querySelector('#listingRoot').innerHTML=`<section class="profile-hero"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a> / <a href="directory.html">Directory</a> / ${x.name}</div><div class="profile-heading"><div class="profile-logo">${x.icon}</div><div><span class="profile-category">${x.category} · ${x.subcategory}</span><h1>${x.name}</h1>${x.bn?`<p class="bn-name">${x.bn}</p>`:''}<p>${x.description}</p></div></div></div></section><section class="directory-section"><div class="container profile-layout"><article class="profile-main"><h2>Contact & Location</h2><div class="contact-grid"><div><span>📍 Address</span><strong>${x.address||'Pending verification'}</strong></div><div><span>📞 Phone</span><strong>${x.phone||'Pending verification'}</strong></div><div><span>☎ Hotline</span><strong>${x.hotline||'Pending verification'}</strong></div><div><span>✉ Email</span><strong>${x.email||'Pending verification'}</strong></div><div><span>🌐 Website</span><strong>${x.website||'Pending verification'}</strong></div><div><span>🕒 Opening Hours</span><strong>${x.hours||'Pending verification'}</strong></div></div><div class="profile-actions">${action(x.phone,`tel:${x.phone}`,'📞 Call','primary')}${action(x.email,`mailto:${x.email}`,'✉ Email')}${action(x.website,x.website,'🌐 Website')}${action(x.address,map,'📍 Directions')}</div><div class="map-placeholder"><span>📍</span><div><strong>${x.district}, ${x.division}</strong><small>Google Maps directions open in a new tab</small></div></div></article><aside class="profile-side"><div class="sidebar-box"><h3>Listing status</h3><div class="verify-badge">✓ ${x.verified}</div><p>Starter information should be checked against the organisation’s official source before public launch, especially phone numbers, email addresses and opening hours.</p><a class="panel-more" href="submit.html">Report incorrect information</a></div><div class="sidebar-box"><h3>Location</h3><div class="sidebar-link"><b>District</b><span>${x.district}</span></div><div class="sidebar-link"><b>Division / Country</b><span>${x.division}</span></div></div></aside></div></section>`;
</script><script defer="" src="v2.js"></script><div class="obm-footer"><a href="index.html">Home</a><a href="community.html">Community hub</a><a href="submit.html">Contact / suggest a listing</a><a href="privacy.html">Privacy notice</a></div></body></html>
